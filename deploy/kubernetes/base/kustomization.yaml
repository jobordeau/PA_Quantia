apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - web-serviceaccount.yaml
  - web-configmap.yaml
  - web-secret.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-ingress.yaml
  - web-hpa.yaml
  - web-pdb.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: quantia

namespace: quantia

images:
  - name: ghcr.io/your-org/quantia-web
    newTag: latest
