apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantia-web
  labels:
    app.kubernetes.io/name: quantia-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: quantia
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quantia-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantia-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: quantia
    spec:
      serviceAccountName: quantia-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/your-org/quantia-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: quantia-web-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: MlApi__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: quantia-web-config
                  key: ML_API_BASE_URL
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: quantia-web-secrets
                  key: ConnectionStrings__DefaultConnection
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
