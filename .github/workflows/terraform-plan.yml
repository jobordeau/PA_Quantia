name: Terraform Plan

on:
  pull_request:
    paths: ["infra/terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, recette, prod]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, recette, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform plan -no-color -var-file=terraform.tfvars
        continue-on-error: true
