name: Deploy

on:
  push:
    branches: [develop, release, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, recette, prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-env:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            echo "environment=recette" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch — refusing to deploy" && exit 1
          fi

  build-and-push:
    name: Build and push images
    needs: resolve-env
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web image (smoke check)
        run: |
          docker build -f Quantia/Dockerfile -t quantia-web:ci .
          echo "Image web buildée avec succès (tag: ${{ steps.tag.outputs.tag }})"

      - name: Build sentiment-job image (smoke check)
        run: |
          docker build -f sentiment_job/Dockerfile sentiment_job/ -t quantia-sentiment-job:ci
          echo "Image sentiment-job buildée avec succès"

      - name: Skip GCP push (projet scolaire)
        run: echo "Push GCP désactivé"

  deploy-gke:
    name: Deploy to GKE
    needs: [resolve-env, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Skip GKE deploy (projet scolaire)
        run: |
          echo "Déploiement GKE désactivé"
          echo "Environment cible : ${{ needs.resolve-env.outputs.environment }}"
          echo "Image tag : ${{ needs.build-and-push.outputs.image_tag }}"
          echo "Pipeline terminé avec succès"
