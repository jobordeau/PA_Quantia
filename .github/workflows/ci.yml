name: CI

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

env:
  DOTNET_VERSION: "8.0.x"
  PYTHON_VERSION: "3.11"

jobs:
  dotnet-build:
    name: Build & test .NET application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Quantia.sln

      - name: Build
        run: dotnet build Quantia.sln --configuration Release --no-restore

      - name: Test
        run: |
          if find . -name '*.Tests.csproj' -o -name '*Test*.csproj' | grep -q .; then
            dotnet test Quantia.sln --configuration Release --no-build --verbosity normal
          else
            echo "No test projects yet; skipping."
          fi

  python-lint-and-test:
    name: Lint & test Python jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.5.0

      - name: Ruff check (sentiment_job)
        run: |
          if [ -d "sentiment_job" ]; then
            ruff check sentiment_job || echo "⚠️ Ruff warnings (non-bloquant)"
          else
            echo "⏭️ Dossier sentiment_job absent, skip."
          fi

      - name: Ruff check (airflow/dags)
        run: |
          if [ -d "airflow/dags" ]; then
            ruff check airflow/dags || echo "⚠️ Ruff warnings (non-bloquant)"
          else
            echo "⏭️ Dossier airflow/dags absent, skip."
          fi

      - name: Compile-check sentiment_job
        run: |
          if [ -d "sentiment_job" ]; then
            python -m compileall -q sentiment_job
          else
            echo "⏭️ Dossier sentiment_job absent, skip."
          fi

      - name: Compile-check airflow DAGs
        run: |
          if [ -d "airflow/dags" ]; then
            python -m compileall -q airflow/dags
          else
            echo "⏭️ Dossier airflow/dags absent, skip."
          fi

  airflow-dag-tests:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check DAG syntax (sans Airflow)
        run: |
          if [ -d "airflow/dags" ]; then
            python -m compileall -q airflow/dags
            echo "✅ Syntaxe des DAGs validée"
          else
            echo "⏭️ Dossier airflow/dags absent, skip."
          fi

  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, recette, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Format check
        run: |
          if [ -d "infra/terraform" ]; then
            terraform fmt -check -recursive infra/terraform || echo "⚠️ Terraform fmt warnings (non-bloquant)"
          else
            echo "⏭️ Dossier infra/terraform absent, skip."
          fi

      - name: Init (no backend)
        run: |
          if [ -d "infra/terraform/environments/${{ matrix.env }}" ]; then
            cd infra/terraform/environments/${{ matrix.env }}
            terraform init -backend=false
          else
            echo "⏭️ Environnement ${{ matrix.env }} absent, skip."
          fi

      - name: Validate
        run: |
          if [ -d "infra/terraform/environments/${{ matrix.env }}" ]; then
            cd infra/terraform/environments/${{ matrix.env }}
            terraform validate
          else
            echo "⏭️ Environnement ${{ matrix.env }} absent, skip."
          fi

  kustomize-build:
    name: Kustomize build & dry-run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [dev, recette, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Build overlay
        run: |
          if [ -d "deploy/kubernetes/overlays/${{ matrix.overlay }}" ]; then
            kustomize build deploy/kubernetes/overlays/${{ matrix.overlay }} > /tmp/built.yaml
          else
            echo "⏭️ Overlay ${{ matrix.overlay }} absent, skip."
          fi

      - name: Show built manifest
        run: |
          if [ -f "/tmp/built.yaml" ]; then
            head -200 /tmp/built.yaml
          else
            echo "⏭️ Aucun manifest généré."
          fi

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: [dotnet-build, python-lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Quantia/Dockerfile
          push: false
          load: true
          tags: quantia-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sentiment-job image
        run: |
          if [ -f "sentiment_job/Dockerfile" ]; then
            docker build -f sentiment_job/Dockerfile sentiment_job/ -t quantia-sentiment-job:ci \
              || echo "⚠️ Build sentiment-job échoué (non-bloquant)"
          else
            echo "⏭️ sentiment_job/Dockerfile absent, skip."
          fi
