name: CI

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

env:
  DOTNET_VERSION: "8.0.x"
  PYTHON_VERSION: "3.11"

jobs:
  dotnet-build:
    name: Build & test .NET application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Quantia.sln

      - name: Build
        run: dotnet build Quantia.sln --configuration Release --no-restore

      - name: Test
        run: |
          if find . -name '*.Tests.csproj' -o -name '*Test*.csproj' | grep -q .; then
            dotnet test Quantia.sln --configuration Release --no-build --verbosity normal
          else
            echo "No test projects yet; skipping."
          fi

  python-lint-and-test:
    name: Lint & test Python jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.5.0

      - name: Ruff check (sentiment_job)
        run: ruff check sentiment_job

      - name: Ruff check (airflow/dags)
        run: ruff check airflow/dags

      - name: Compile-check sentiment_job
        run: python -m compileall -q sentiment_job

      - name: Compile-check airflow DAGs
        run: python -m compileall -q airflow/dags

  airflow-dag-tests:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Airflow
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.2/constraints-${{ env.PYTHON_VERSION }}.txt"

      - name: Run DAG tests
        run: pytest airflow/tests -v

  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, recette, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Init (no backend)
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform validate

  kustomize-build:
    name: Kustomize build & dry-run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [dev, recette, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Build overlay
        run: kustomize build deploy/kubernetes/overlays/${{ matrix.overlay }} > /tmp/built.yaml

      - name: Show built manifest
        run: head -200 /tmp/built.yaml

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: [dotnet-build, python-lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Quantia/Dockerfile
          push: false
          load: true
          tags: quantia-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sentiment-job image
        uses: docker/build-push-action@v6
        with:
          context: ./sentiment_job
          file: ./sentiment_job/Dockerfile
          push: false
          load: true
          tags: quantia-sentiment-job:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
